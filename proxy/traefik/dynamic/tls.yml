tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305

http:
  middlewares:
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true

    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    cors:
      cors:
        allowOrigins:
          - "https://yourdomain.com"
        allowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
        allowHeaders:
          - "Authorization"
          - "Content-Type"
        exposeHeaders:
          - "X-Request-Id"
        maxAge: 3600