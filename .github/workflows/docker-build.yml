name: Docker Build & Publish

"on":
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openpay/dashboard
            context: ./apps/merchant-dashboard
            dockerfile: ./apps/merchant-dashboard/Dockerfile
          - image: openpay/nats-kb-bridge
            context: ./payment-system/nats-kb-bridge
            dockerfile: ./payment-system/nats-kb-bridge/Dockerfile
          - image: openpay/tazama-rule-exec
            context: ./monitoring-and-rules/tazama-rule-exec
            dockerfile: ./monitoring-and-rules/tazama-rule-exec/Dockerfile
          - image: openpay/tazama-auth
            context: ./monitoring-and-rules/tazama-auth
            dockerfile: ./monitoring-and-rules/tazama-auth/Dockerfile
    uses: ./.github/workflows/publish-images.yml
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      version: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      publish-latest: ${{ startsWith(github.ref, 'refs/tags/') }}
    secrets: inherit
