name: Release

"on":
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate SemVer tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      bump: ${{ steps.semver.outputs.bump }}
      is_major: ${{ steps.semver.outputs.is_major }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag shape (vMAJOR.MINOR.PATCH)
        run: ./scripts/version.sh validate "${{ github.ref_name }}"
      - name: Determine bump type vs previous tag
        id: semver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          prev="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v -F "$REF_NAME" | head -n1 || true)"
          if [ -z "$prev" ]; then bump="major"; else bump="$(./scripts/version.sh diff "$REF_NAME" "$prev")"; fi
          is_major="false"
          [ "$bump" = "major" ] && is_major="true"
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "is_major=$is_major" >> "$GITHUB_OUTPUT"
          echo "previous tag: ${prev:-<none>} → $REF_NAME ($bump bump)"

  staging-validate:
    name: Full environment gate
    runs-on: ubuntu-latest
    needs: validate
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.version }}
      - name: Initialize env files
        run: |
          cp .env.example .env
          cp payment-system/hyperswitch/.env.example payment-system/hyperswitch/.env
          cp payment-system/killbill/.env.example payment-system/killbill/.env
          cp payment-system/nats-kb-bridge/.env.example payment-system/nats-kb-bridge/.env
          cp event-bus/.env.example event-bus/.env
          cp monitoring-and-rules/.env.example monitoring-and-rules/.env
          cp monitoring-and-rules/tazama-auth/.env.example monitoring-and-rules/tazama-auth/.env
          cp monitoring-and-rules/tazama-rule-exec/.env.example monitoring-and-rules/tazama-rule-exec/.env
          cp monitoring-and-rules/tazama-rule-studio/.env.example monitoring-and-rules/tazama-rule-studio/.env
          cp monitoring-and-rules/case-management/.env.example monitoring-and-rules/case-management/.env
      - name: Install NATS CLI
        run: |
          curl -sfL https://binaries.nats.dev/nats-io/natscli/nats@latest | sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Run full environment smoke (release gate)
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: bash ./scripts/ci-smoke.sh
        timeout-minutes: 25

  publish:
    name: Publish images (${{ matrix.image }})
    needs: [validate, staging-validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openpay/dashboard
            context: ./apps/merchant-dashboard
            dockerfile: ./apps/merchant-dashboard/Dockerfile
          - image: openpay/nats-kb-bridge
            context: ./payment-system/nats-kb-bridge
            dockerfile: ./payment-system/nats-kb-bridge/Dockerfile
          - image: openpay/tazama-rule-exec
            context: ./monitoring-and-rules/tazama-rule-exec
            dockerfile: ./monitoring-and-rules/tazama-rule-exec/Dockerfile
          - image: openpay/tazama-auth
            context: ./monitoring-and-rules/tazama-auth
            dockerfile: ./monitoring-and-rules/tazama-auth/Dockerfile
    uses: ./.github/workflows/publish-images.yml
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      version: ${{ needs.validate.outputs.version }}
      publish-latest: true
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: [validate, staging-validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Build release artifacts
        id: artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          ./scripts/release-artifacts.sh "$VERSION" release-bundle \
            "ghcr.io/${GH_OWNER}/openpay/dashboard:${VERSION}"
          cd release-bundle
          cosign sign-blob --yes release.tar.gz \
            --output-signature release.tar.gz.sig \
            --output-certificate release.tar.gz.pem
          cosign verify-blob --certificate release.tar.gz.pem --signature release.tar.gz.sig release.tar.gz
          sha256sum release.tar.gz.sig release.tar.gz.pem >> release.sha256
          echo "bundle_dir=$GITHUB_WORKSPACE/release-bundle" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          name: OpenPay ${{ needs.validate.outputs.version }}
          body: |
            ## OpenPay ${{ needs.validate.outputs.version }}

            This is a **${{ needs.validate.outputs.bump }}** release.

            ### Images
            - `ghcr.io/${{ github.repository_owner }}/openpay/dashboard:${{ needs.validate.outputs.version }}` (+ floating `v<major>.<minor>` / `v<major>` / `latest`)
            - `ghcr.io/${{ github.repository_owner }}/openpay/nats-kb-bridge:${{ needs.validate.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/openpay/tazama-rule-exec:${{ needs.validate.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/openpay/tazama-auth:${{ needs.validate.outputs.version }}`
            - Same tag set on Docker Hub under `${{ secrets.DOCKERHUB_USERNAME != '' && 'your Docker Hub namespace' || 'Docker Hub (not configured)' }}`.

            ### Attestation
            All images are signed with Sigstore keyless signing and carry SBOM + SLSA provenance. Verify:
            ```
            cosign verify ghcr.io/${{ github.repository_owner }}/openpay/dashboard:${{ needs.validate.outputs.version }} \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```

            ### Upgrade (self-hosted)
            ```bash
            git fetch --tags && git checkout ${{ needs.validate.outputs.version }}
            # or automated:
            make upgrade TARGET=${{ needs.validate.outputs.version }}
            ```

            ### Artifacts
            - `release.tar.gz` — clean source snapshot (signed)
            - `release.sha256` — checksums
            - `release.sbom.json` — CycloneDX SBOM of the dashboard image
            - `release.attestation.json` — SLSA-style provenance
          generate_release_notes: true
          draft: false
          files: |
            ${{ steps.artifacts.outputs.bundle_dir }}/*
