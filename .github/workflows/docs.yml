name: Docs

"on":
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/merchant-dashboard/src/app/docs/**'
      - '**/*.md'
  pull_request:
    paths:
      - 'docs/**'
      - 'apps/merchant-dashboard/src/app/docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/link-check-config.json'

  build:
    name: Docs app build + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/merchant-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/merchant-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_HYPERSWITCH_URL: 'http://localhost:8081'
          NEXT_PUBLIC_HYPERSWITCH_PUBLISHABLE_KEY: 'pk_test_ci_placeholder'
          KINDE_CLIENT_ID: 'ci_placeholder'
          KINDE_CLIENT_SECRET: 'ci_placeholder'
          KINDE_ISSUER_URL: 'https://placeholder.kinde.com'
