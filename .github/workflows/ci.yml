name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      core: ${{ steps.filter.outputs.core }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dashboard:
              - 'apps/merchant-dashboard/**'
            core:
              - 'docker-compose.yml'
              - 'scripts/**'
              - 'event-bus/**'
              - 'payment-system/**'
              - 'monitoring-and-rules/**'
            workflows:
              - '.github/workflows/**'

  lint-typecheck:
    name: Lint & typecheck (dashboard)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.workflows == 'true'
    env:
      CI: true
    defaults:
      run:
        working-directory: apps/merchant-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/merchant-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint

  unit-tests:
    name: Unit tests (if present)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/merchant-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/merchant-dashboard
      - name: Run tests if a test script exists
        working-directory: apps/merchant-dashboard
        run: |
          if grep -q '"test"' package.json; then pnpm test --if-present; else echo "no test script — skipping (add tests to enable this gate)"; fi

  config-validation:
    name: Validate compose & env config
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Shell-check scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Compose config validation
        run: docker compose config -q
      - name: Validate env templates
        run: |
          cp .env.example .env
          cp .env.production.example .env.prod.tmp
          bash -n scripts/validate-config.sh
          echo "env template validation ok"

  docker-build:
    name: Docker build validation (dashboard)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/merchant-dashboard/pnpm-lock.yaml
      - uses: docker/setup-buildx-action@v3
      - name: Build dashboard image (no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/merchant-dashboard
          file: apps/merchant-dashboard/Dockerfile
          push: false
          tags: openpay/dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Compose deployment + smoke test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Initialize env files
        run: |
          cp .env.example .env
          cp payment-system/hyperswitch/.env.example payment-system/hyperswitch/.env
          cp payment-system/killbill/.env.example payment-system/killbill/.env
          cp payment-system/nats-kb-bridge/.env.example payment-system/nats-kb-bridge/.env
          cp event-bus/.env.example event-bus/.env
          cp monitoring-and-rules/.env.example monitoring-and-rules/.env
          cp monitoring-and-rules/tazama-auth/.env.example monitoring-and-rules/tazama-auth/.env
          cp monitoring-and-rules/tazama-rule-exec/.env.example monitoring-and-rules/tazama-rule-exec/.env
          cp monitoring-and-rules/tazama-rule-studio/.env.example monitoring-and-rules/tazama-rule-studio/.env
          cp monitoring-and-rules/case-management/.env.example monitoring-and-rules/case-management/.env
      - name: Install NATS CLI (stream init, best-effort)
        run: |
          if curl -sfL https://binaries.nats.dev/nats-io/natscli/nats@latest | sh; then
            echo "$HOME/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::NATS CLI install failed — ci-smoke.sh will skip stream init"
          fi
      - name: Run environment smoke
        run: bash ./scripts/ci-smoke.sh
        timeout-minutes: 20
        env:
          COMPOSE_PROFILES: core
