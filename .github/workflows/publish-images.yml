name: Publish Images (reusable)

"on":
  workflow_call:
    inputs:
      image:
        required: true
        type: string
        description: Image name (e.g. openpay/dashboard)
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""
        description: Release version (v1.2.0). Empty → edge build (main branch).
      publish-latest:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-publish:
    name: Build & push ${{ inputs.image }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: ${{ contains(inputs.image, 'dashboard') }}
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: ${{ contains(inputs.image, 'dashboard') }}
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/merchant-dashboard/pnpm-lock.yaml

      - name: Compute registry tags
        id: tags
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          GH_OWNER: ${{ github.repository_owner }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SHA: ${{ github.sha }}
        run: |
          owner="$(echo "${GH_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          refs="ghcr.io/${owner}/${IMAGE}"
          dh_refs=""
          if [ -n "${DH_USER}" ]; then dh_refs="docker.io/${DH_USER}/${IMAGE}"; fi

          if [ -n "${VERSION}" ]; then
            # semver set: v1.2.0 → v1.2.0, v1.2, v1
            v="${VERSION#v}"
            maj="${v%%.*}"; rest="${v#*.}"; min="${rest%%.*}"; pat="${rest#*.}"
            tags="${refs}:${VERSION},${refs}:v${maj}.${min},${refs}:v${maj}"
            if [ -n "${dh_refs}" ]; then
              tags="${tags},${dh_refs}:${VERSION},${dh_refs}:v${maj}.${min},${dh_refs}:v${maj}"
            fi
          else
            tags="${refs}:edge,${refs}:sha-${SHA:0:7}"
            if [ -n "${dh_refs}" ]; then tags="${tags},${dh_refs}:edge,${dh_refs}:sha-${SHA:0:7}"; fi
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Add :latest
        id: tags-latest
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          IMAGE: ${{ inputs.image }}
          GH_OWNER: ${{ github.repository_owner }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          PUBLISH_LATEST: ${{ inputs.publish-latest }}
        run: |
          tags="$TAGS"
          if [ "$PUBLISH_LATEST" = "true" ]; then
            tags="${tags},ghcr.io/$(echo "${GH_OWNER}" | tr '[:upper:]' '[:lower:]')/${IMAGE}:latest"
            if [ -n "${DH_USER}" ]; then tags="${tags},docker.io/${DH_USER}/${IMAGE}:latest"; fi
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (if configured)
        uses: docker/login-action@v3
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign (keyless signing)
        uses: sigstore/cosign-installer@v3.8.2

      - name: Build, tag & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags-latest.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Sign image (cosign keyless)
        env:
          GHCR_IMAGE: ghcr.io/${{ steps.tags.outputs.owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$GHCR_IMAGE"

      - name: Verify signature
        env:
          GHCR_IMAGE: ghcr.io/${{ steps.tags.outputs.owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          GH_REPO: ${{ github.repository }}
        run: |
          cosign verify "$GHCR_IMAGE" --insecure-ignore-tlog \
            --certificate-identity-regexp "https://github.com/$GH_REPO/.github/workflows/*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Generate SBOM (syft) for GHCR image
        uses: anchore/sbom-action@v0.24.0
        if: ${{ steps.build.outputs.digest != '' }}
        with:
          image: ghcr.io/${{ steps.tags.outputs.owner }}/${{ inputs.image }}@${{ steps.build.outputs.digest }}
          artifact-name: sbom-${{ inputs.image }}
          dependency-snapshot: true

      - name: Upload build attestation (provenance)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ steps.tags.outputs.owner }}/${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
