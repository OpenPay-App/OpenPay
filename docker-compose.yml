services:
  # Edge Reverse Proxy & TLS Routing
  proxy:
    image: traefik:v2.10
    container_name: core-proxy
    restart: unless-stopped
    profiles:
      - core
      - full
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./proxy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./proxy/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: core-postgres
    restart: unless-stopped
    profiles:
      - core
      - full
    environment:
      POSTGRES_USER: coreplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
      POSTGRES_DB: hyperswitch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - core-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: core-redis
    restart: unless-stopped
    profiles:
      - core
      - full
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS JetStream Event Bus
  nats:
    image: nats:2.9-alpine
    container_name: core-nats
    restart: unless-stopped
    profiles:
      - core
      - full
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./event-bus/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    command: ["-c", "/etc/nats/nats-server.conf"]
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mock Superposition (Local Dev)
  mock-superposition:
    build:
      context: ./payment-system/hyperswitch/mock-superposition
      dockerfile: Dockerfile
    container_name: core-mock-superposition
    restart: unless-stopped
    profiles:
      - core
      - full
    ports:
      - "9999:9999"
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9999/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Hyperswitch Payment Orchestration
  hyperswitch:
    image: juspaydotin/hyperswitch-router:v1.125.0
    container_name: core-hyperswitch
    restart: unless-stopped
    profiles:
      - core
      - full
    command: "/local/bin/router -f /local/config/docker_compose.toml"
    ports:
      - "8081:8080"
    env_file:
      - ./payment-system/hyperswitch/.env
    environment:
      # Must be a valid router_env::Env value ("development"). "docker_compose" was
      # being parsed as unknown and falling back to "production", which makes the
      # /user/connect_account signup flow reject new users with "Incorrect email or password".
      RUN_ENV: development
      ROUTER__MASTER_DATABASE__HOST: "core-postgres"
      ROUTER__MASTER_DATABASE__PORT: 5432
      ROUTER__MASTER_DATABASE__DBNAME: "hyperswitch"
      ROUTER__MASTER_DATABASE__USERNAME: "coreplatform"
      ROUTER__MASTER_DATABASE__PASSWORD: ${POSTGRES_PASSWORD}
      ROUTER__SECRETS__JWT_SECRET: ${HYPERSWITCH_JWT_SECRET}
      ROUTER__SECRETS__ADMIN_API_KEY: ${HYPERSWITCH_ADMIN_API_KEY}
      ROUTER__SECRETS__MASTER_ENC_KEY: "73ad7bbbbc640c845a150f67d058b279849370cd2c1f3c67c4dd6c869213e13a"
      ROUTER__REDIS__HOST: "core-redis"
      ROUTER__REDIS__PORT: 6379
      ROUTER__SUPERPOSITION__ENABLED: "false"
      ROUTER__SUPERPOSITION__ENDPOINT: "http://mock-superposition:9999"
      ROUTER__SUPERPOSITION__TOKEN: "local_token"
      ROUTER__SUPERPOSITION__ORG_ID: "local_org"
      ROUTER__SUPERPOSITION__WORKSPACE_ID: "local_workspace"
      ROUTER__SUPERPOSITION__LOCAL_FILE_PATH: "/local/config/superposition_config.json"
      # Email delivery (team invites / verification / magic links) — provider-agnostic SMTP
      # Dev default targets the local MailHog catcher (see mailhog service, profile: dev).
      # Point at any SMTP provider in production via root .env EMAIL_* vars.
      ROUTER__USER__BASE_URL: ${HYPERSWITCH_DASHBOARD_URL:-http://localhost:9000}
      ROUTER__EMAIL__ACTIVE_EMAIL_CLIENT: ${EMAIL_ACTIVE_CLIENT:-SMTP}
      ROUTER__EMAIL__SENDER_EMAIL: ${EMAIL_SENDER_EMAIL:-no-reply@openpay.dev}
      ROUTER__EMAIL__SMTP__HOST: ${EMAIL_SMTP_HOST:-mailhog}
      ROUTER__EMAIL__SMTP__PORT: ${EMAIL_SMTP_PORT:-1025}
      ROUTER__EMAIL__SMTP__CONNECTION: ${EMAIL_SMTP_CONNECTION:-plaintext}
      ROUTER__EMAIL__SMTP__TIMEOUT: ${EMAIL_SMTP_TIMEOUT:-10}
      ROUTER__EMAIL__SMTP__USERNAME: ${EMAIL_SMTP_USERNAME:-mailhog}
      ROUTER__EMAIL__SMTP__PASSWORD: ${EMAIL_SMTP_PASSWORD:-mailhog}
    volumes:
      - ./payment-system/hyperswitch/config:/local/config:ro
    depends_on:
      mock-superposition:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Hyperswitch Control Center (Dashboard UI)
  # Pinned to the CC build released the same day as the router (v1.125.0, 2026-06-30).
  # The `latest` tag was 4.5 months older and its login/verify flows fail client-side
  # against the v1.125.0 router (shows "Invalid Link or session expired").
  hyperswitch-control-center:
    image: juspaydotin/hyperswitch-control-center:2026.06.30.0
    container_name: core-hyperswitch-dashboard
    restart: unless-stopped
    profiles:
      - core
      - full
    ports:
      - "9000:9000"
    environment:
      - configPath=/tmp/dashboard-config.toml
      - themeConfigPath=/tmp/dashboard-theme.json
      # Optional Control Center overrides (hyperswitch-control-center README).
      # HYPER_EMAIL_ENABLED=true switches team invites to email delivery.
      # HYPERSWITCH_PUBLIC_API_URL is the browser-reachable router URL (must be public in prod).
      # Keys follow the parser's default.endpoints.* schema (config/feature endpoint).
      - default__features__email=${HYPER_EMAIL_ENABLED:-false}
      - default__endpoints__api_url=${HYPERSWITCH_PUBLIC_API_URL:-http://localhost:8081}
      - default__endpoints__sdk_url=${HYPERSWITCH_PUBLIC_API_URL:-http://localhost:8081}
    volumes:
      - ./payment-system/hyperswitch/config/dashboard.toml:/tmp/dashboard-config.toml:ro
      - ./payment-system/hyperswitch/config/dashboard_theme.json:/tmp/dashboard-theme.json:ro
    depends_on:
      hyperswitch:
        condition: service_healthy
    networks:
      - core-net

  # MailHog — local email catcher for development & testing (Web UI: http://localhost:8025)
  # Start with: docker compose --profile dev up -d mailhog
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: core-mailhog
    restart: unless-stopped
    profiles:
      - dev
      - full
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - core-net

  # Kill Bill Subscription & Billing
  killbill:
    image: killbill/killbill:0.24.11
    container_name: core-killbill
    restart: unless-stopped
    profiles:
      - core
      - full
    ports:
      - "8082:8080"
    env_file:
      - ./payment-system/killbill/.env
    volumes:
      - ./payment-system/killbill/config:/etc/killbill/config:ro
      - ./payment-system/killbill/plugins:/var/lib/killbill/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/1.0/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NATS-KB Bridge (Reconciliation)
  nats-kb-bridge:
    build:
      context: ./payment-system/nats-kb-bridge
      dockerfile: Dockerfile
    container_name: core-nats-kb-bridge
    restart: unless-stopped
    profiles:
      - core
      - full
    env_file:
      - ./payment-system/nats-kb-bridge/.env
    depends_on:
      nats:
        condition: service_healthy
      killbill:
        condition: service_healthy
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Tazama Auth Service
  tazama-auth:
    build:
      context: ./monitoring-and-rules/tazama-auth
      dockerfile: Dockerfile
    container_name: core-tazama-auth
    restart: unless-stopped
    profiles:
      - tazama
      - full
    ports:
      - "8083:8080"
    env_file:
      - ./monitoring-and-rules/tazama-auth/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Tazama Rule Execution Engine
  tazama-rule-exec:
    build:
      context: ./monitoring-and-rules/tazama-rule-exec
      dockerfile: Dockerfile
    container_name: core-tazama-rule-exec
    restart: unless-stopped
    profiles:
      - tazama
      - full
    ports:
      - "8084:8080"
    env_file:
      - ./monitoring-and-rules/tazama-rule-exec/.env
    volumes:
      - ./monitoring-and-rules/tazama-rule-exec/rules:/etc/tazama/rules:ro
    depends_on:
      nats:
        condition: service_healthy
      tazama-auth:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Tazama Rule Studio UI
  tazama-rule-studio:
    build:
      context: ./monitoring-and-rules/tazama-rule-studio
      dockerfile: Dockerfile
    container_name: core-tazama-rule-studio
    restart: unless-stopped
    profiles:
      - tazama
      - full
    ports:
      - "3002:8080"
    env_file:
      - ./monitoring-and-rules/tazama-rule-studio/.env
    depends_on:
      tazama-rule-exec:
        condition: service_healthy
    networks:
      - core-net

  # Case Management Dashboard
  case-management:
    build:
      context: ./monitoring-and-rules/case-management
      dockerfile: Dockerfile
    container_name: core-case-management
    restart: unless-stopped
    profiles:
      - tazama
      - full
    ports:
      - "3001:8080"
    env_file:
      - ./monitoring-and-rules/case-management/.env
    depends_on:
      tazama-rule-exec:
        condition: service_healthy
    networks:
      - core-net

  # --- FREE MONITORING SERVICES FOR TESTING ---
  # These only start with: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:latest
    container_name: core-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
      - full
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - core-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: core-grafana
    restart: unless-stopped
    profiles:
      - monitoring
      - full
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:latest
    container_name: core-loki
    restart: unless-stopped
    profiles:
      - monitoring
      - full
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki:/etc/loki
      - loki-data:/loki
    networks:
      - core-net
    command: -config.file=/etc/loki/loki.yml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    image: grafana/promtail:latest
    container_name: core-promtail
    restart: unless-stopped
    profiles:
      - monitoring
      - full
    volumes:
      - ./monitoring/promtail:/etc/promtail
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/tmp/promtail
    networks:
      - core-net
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  postgres-data:
  redis-data:
  nats-data:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-data:

networks:
  core-net:
    driver: bridge