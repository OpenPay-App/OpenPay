version: '3.8'

services:
  # Edge Reverse Proxy & TLS Routing
  proxy:
    image: traefik:v2.10
    container_name: core-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./proxy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./proxy/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coreplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
      POSTGRES_DB: hyperswitch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - core-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: core-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-localdev123}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localdev123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS JetStream Event Bus
  nats:
    image: nats:2.9-alpine
    container_name: core-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./event-bus/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    command: ["-c", "/etc/nats/nats-server.conf"]
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Hyperswitch Payment Orchestration
  hyperswitch:
    image: juspaydotin/hyperswitch-router:latest
    container_name: core-hyperswitch
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - ./payment-system/hyperswitch/.env
    volumes:
      - ./payment-system/hyperswitch/config:/etc/hyperswitch/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kill Bill Subscription & Billing
  killbill:
    image: killbill/killbill:0.24.11
    container_name: core-killbill
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - ./payment-system/killbill/.env
    volumes:
      - ./payment-system/killbill/config:/etc/killbill/config:ro
      - ./payment-system/killbill/plugins:/var/lib/killbill/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/1.0/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NATS-KB Bridge (Reconciliation)
  nats-kb-bridge:
    build:
      context: ./payment-system/nats-kb-bridge
      dockerfile: Dockerfile
    container_name: core-nats-kb-bridge
    restart: unless-stopped
    env_file:
      - ./payment-system/nats-kb-bridge/.env
    depends_on:
      nats:
        condition: service_healthy
      killbill:
        condition: service_healthy
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Tazama Auth Service
  tazama-auth:
    build:
      context: ./monitoring-and-rules/tazama-auth
      dockerfile: Dockerfile
    container_name: core-tazama-auth
    restart: unless-stopped
    ports:
      - "8083:8080"
    env_file:
      - ./monitoring-and-rules/tazama-auth/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Tazama Rule Execution Engine
  tazama-rule-exec:
    build:
      context: ./monitoring-and-rules/tazama-rule-exec
      dockerfile: Dockerfile
    container_name: core-tazama-rule-exec
    restart: unless-stopped
    ports:
      - "8084:8080"
    env_file:
      - ./monitoring-and-rules/tazama-rule-exec/.env
    volumes:
      - ./monitoring-and-rules/tazama-rule-exec/rules:/etc/tazama/rules:ro
    depends_on:
      nats:
        condition: service_healthy
      tazama-auth:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - core-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Tazama Rule Studio UI
  tazama-rule-studio:
    build:
      context: ./monitoring-and-rules/tazama-rule-studio
      dockerfile: Dockerfile
    container_name: core-tazama-rule-studio
    restart: unless-stopped
    ports:
      - "3000:8080"
    env_file:
      - ./monitoring-and-rules/tazama-rule-studio/.env
    depends_on:
      tazama-rule-exec:
        condition: service_healthy
    networks:
      - core-net

  # Case Management Dashboard
  case-management:
    build:
      context: ./monitoring-and-rules/case-management
      dockerfile: Dockerfile
    container_name: core-case-management
    restart: unless-stopped
    ports:
      - "3001:8080"
    env_file:
      - ./monitoring-and-rules/case-management/.env
    depends_on:
      tazama-rule-exec:
        condition: service_healthy
    networks:
      - core-net

volumes:
  postgres-data:
  redis-data:
  nats-data:

networks:
  core-net:
    driver: bridge