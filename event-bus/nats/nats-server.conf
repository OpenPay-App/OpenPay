server_name: core-nats
host: 0.0.0.0
port: 4222
http_port: 8222

# JetStream Configuration
jetstream {
    store_dir: /data/jetstream
    max_mem: 1G
    max_file_store: 10G
}

# Authentication
authorization {
    user: core-nats-user
    password: your_secure_password_here
}

# Logging
logtime: true
debug: false
trace: false

# Monitoring
write_deadline: 10s

# Client Settings
max_connections: 65536
max_payload: 1048576  # 1MB
max_control_line: 4096

# WebSocket Support (optional)
websocket {
    port: 8080
    no_tls: true
}