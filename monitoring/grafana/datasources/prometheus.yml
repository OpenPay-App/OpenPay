# Grafana datasource provisioning.
# Mounted into the grafana container at /etc/grafana/provisioning/datasources/prometheus.yml.
# See docs: /docs/self-hosting/monitoring

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
