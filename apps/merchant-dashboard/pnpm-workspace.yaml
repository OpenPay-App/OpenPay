allowBuilds:
  sharp: set this to true or false
# Allow native build scripts for dependencies that need them (e.g. sharp,
# which Next.js uses for image optimization). Without this, pnpm 10+ blocks
# the build script and fails install/tsc with "Ignored build scripts".
# See: https://pnpm.io/settings#onlybuiltdependencies
onlyBuiltDependencies:
  - sharp
