# Allow native build scripts for dependencies that need them (e.g. sharp,
# which Next.js uses for image optimization, and unrs-resolver which
# eslint-config-next uses). Without this, pnpm 10+ blocks the build script
# and fails install/tsc with "Ignored build scripts".
# See: https://pnpm.io/settings#onlybuiltdependencies
allowBuilds:
  sharp: true
  unrs-resolver: true